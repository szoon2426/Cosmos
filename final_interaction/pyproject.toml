[project]
name = "cosmos-final-interaction"
version = "0.1.0"
description = "Cosmos final webcam interaction runtime"
requires-python = ">=3.10,<3.13"
dependencies = [
    "mediapipe>=0.10.14",
    "numpy>=1.26",
    "opencv-python>=4.10",
    "PySide6>=6.7",
    "pywin32>=306; platform_system == 'Windows'",
    "requests>=2.32",
]

[project.scripts]
final-interaction = "src.realtime_inference_final:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
